[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gukhan"
version = "0.0.0"
description = "Hangul to Hanja mixed-script (國漢混用) converter"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "the gukhan contributors" }]
keywords = ["korean", "hanja", "hangul", "mixed-script", "kiwi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "kiwipiepy>=0.24",
]

[project.urls]
Homepage = "https://github.com/peepeetee/gukhan"
Issues = "https://github.com/peepeetee/gukhan/issues"

[project.optional-dependencies]
lexicon = ["gukhan-lexicon"]
dev = [
    "pip-licenses>=5.0",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
gukhan = "gukhan.cli:main"
gukhan-lexicon-build = "gukhan.lexicon_build.cli:main"
gukhan-regress = "gukhan.regress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gukhan = ["data/*.tsv"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
