[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gukhan"
version = "0.0.0"
description = "Hangul to Hanja mixed-script (國漢混用) converter"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "the gukhan contributors" }]
dependencies = [
    "kiwipiepy>=0.20",
]

[project.optional-dependencies]
dev = [
    "pip-licenses>=5.0",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
gukhan = "gukhan.cli:main"
gukhan-lexicon-build = "gukhan.lexicon_build.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gukhan = ["data/*.tsv"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
