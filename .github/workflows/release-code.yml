name: release-code

# Runs when a version tag is pushed. Builds gukhan and, after an approval on the `pypi` environment,
# publishes it to PyPI with trusted publishing (no token stored).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: gukhan-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi # configure required reviewers here: this is the approval step
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gukhan-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
