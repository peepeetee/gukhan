name: licence-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project with dev and docs extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"
      - name: SPDX headers and dependency licences
        run: python scripts/check_licences.py
