name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Bilingual messages (Korean and English)
        run: python scripts/check_bilingual.py
      - name: Test
        if: ${{ matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13' }}
        run: python -m pytest -q
      - name: Test with coverage (line and branch; the floor is `fail_under` in pyproject.toml)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report

  typecheck:
    # The library ships a py.typed marker, so its annotations are checked strictly (config in pyproject.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m mypy

  docs:
    # Builds the static documentation site (mkdocs.yml, strict: a broken link or a missing API entry fails).
    # The result is not deployed or uploaded anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"
      - run: python -m mkdocs build --strict

  release-dryrun:
    # Builds both packages, runs twine, installs the wheels into a clean venv and smoke-tests them.
    # Publishes nothing; the real release workflows are release-code.yml and release-lexicon.yml.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python scripts/release_dryrun.py
